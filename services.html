<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lalasco Enterprise - Products</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Roboto', sans-serif; margin:0; padding:0; }
header { padding: 10px; background: #1a73e8; color:white; }
.nav-bar a { color:white; margin-right:15px; text-decoration:none; }
.cart-icon { position: fixed; top:20px; right:20px; width:60px; height:60px; background:#1a73e8; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:999; }
.cart-icon img { width:30px; height:30px; }
.cart-badge { position:absolute; top:-5px; right:-5px; background:red; color:white; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.8rem; }
.items-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:20px; margin:20px; }
.item { border:1px solid #ccc; border-radius:8px; padding:10px; text-align:center; }
.item img { width:100%; height:150px; object-fit:cover; border-radius:5px; }
.item button { background:#1a73e8; color:white; border:none; padding:6px 10px; border-radius:5px; margin-top:5px; cursor:pointer; }
.item button:hover { background:#1558b0; }
#cart-items { margin:20px; border:1px solid #ccc; border-radius:8px; padding:15px; }
button#checkout-btn { background:#1a73e8; color:white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; margin:20px; font-weight:bold; }
button#checkout-btn:hover { background:#1558b0; }

.checkout-form {
  margin: 20px;
  padding: 15px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#f8f8f8;
}
.checkout-form input, 
.checkout-form select {
  width:90%;
  padding:10px;
  margin:10px 0;
  border-radius:6px;
  border:1px solid #888;
}
</style>
</head>
<body>

<header>
  <h1>Lalasco Enterprise</h1>
</header>

<div class="cart-icon" onclick="scrollToCart()">
  <img src="https://cdn-icons-png.flaticon.com/512/263/263142.png">
  <div class="cart-badge" id="cart-count">0</div>
</div>

<section>
  <h2 style="margin-left:20px;">Our Products</h2>
  <div class="items-grid" id="items-grid">Loading products...</div>

  <h2 style="margin-left:20px;">Your Cart</h2>
  <div id="cart-items"></div>
  <p style="margin-left:20px;">Total: GHS <span id="cart-total">0</span></p>

  <!-- ⭐ Checkout Form -->
  <div class="checkout-form">
    <h3>Fill Your Details</h3>

    <input id="client-name" type="text" placeholder="Full Name">
    <input id="client-phone" type="text" placeholder="Phone Number">
    <input id="client-location" type="text" placeholder="Your Location">

    <label><b>Delivery Method</b></label>
    <select id="delivery-method">
      <option value="Delivery">Delivery</option>
      <option value="Pickup">Pickup</option>
    </select>

    <label><b>Payment Method</b></label>
    <select id="payment-method">
      <option value="Mobile Money">Mobile Money</option>
      <option value="Cash on Delivery">Cash on Delivery</option>
    </select>

    <label><b>WhatsApp To Send Order</b></label>
    <select id="whatsapp-number">
      <option value="233532719501">Bechem (0532719501)</option>
      <option value="233509277704">Goaso (0509277704)</option>
      <option value="233243145242">Kumasi (0243145242)</option>
      <option value="233597891812">Sunyani (0597891812)</option>
    </select>
  </div>

  <button id="checkout-btn">Checkout via WhatsApp</button>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getFirestore, collection, doc, updateDoc, onSnapshot, getDoc, increment } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyCZr_BssC2x38PDGy4ZtPHbxWaIiMOfcgE",
  authDomain: "lalasco-enterprises.firebaseapp.com",
  projectId: "lalasco-enterprises",
  storageBucket: "lalasco-enterprises.firebasestorage.app",
  messagingSenderId: "664365153484",
  appId: "1:664365153484:web:0a8f713a172fb56dd55669"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const itemsGrid = document.getElementById("items-grid");
const cartItems = document.getElementById("cart-items");
const cartTotal = document.getElementById("cart-total");
const cartCount = document.getElementById("cart-count");
let cart = [];

/* Load Products Live */
const productsCollection = collection(db, "products");
onSnapshot(productsCollection, snapshot => {
  const products = [];
  snapshot.forEach(doc => products.push({ id: doc.id, ...doc.data() }));
  displayProducts(products);
});

/* Display Products */
function displayProducts(products){
  itemsGrid.innerHTML = "";
  products.forEach(item => {
    const div = document.createElement("div");
    div.classList.add("item");

    div.innerHTML = `
      <img src="${item.image}">
      <h4>${item.name}</h4>
      <p>${item.stock === 0 ? 'Sold Out' : 'In Stock'}</p>
      <button ${item.stock === 0 ? "disabled" : ""} 
      onclick='addToCart(${JSON.stringify(item)})'>
        ${item.stock === 0 ? "Sold Out" : "Add to Cart"}
      </button>
    `;

    itemsGrid.appendChild(div);
  });
}

/* Cart Logic */
window.addToCart = function(item){
  const exist = cart.find(c => c.id === item.id);
  if(exist){
    if(exist.quantity < item.stock) exist.quantity++;
    else alert("Not enough stock");
  } else cart.push({ ...item, quantity: 1 });

  updateCartUI();
}

window.updateCartUI = function(){
  cartItems.innerHTML = "";
  let total = 0;
  cart.forEach((i, idx) => {
    total += i.price * i.quantity;
    cartItems.innerHTML += `
      <div style="display:flex; justify-content:space-between;">
        <span>${i.name} x ${i.quantity} = GHS ${i.price * i.quantity}</span>
        <span>
          <button onclick="decreaseQuantity(${idx})">-</button>
          <button onclick="increaseQuantity(${idx})">+</button>
          <button onclick="removeItem(${idx})">🗑️</button>
        </span>
      </div>
    `;
  });
  cartTotal.textContent = total;
  cartCount.textContent = cart.reduce((s, i) => s + i.quantity, 0);
}

window.increaseQuantity = idx => { cart[idx].quantity++; updateCartUI(); }
window.decreaseQuantity = idx => { if(cart[idx].quantity > 1) cart[idx].quantity--; else cart.splice(idx,1); updateCartUI(); }
window.removeItem = idx => { cart.splice(idx,1); updateCartUI(); }
window.scrollToCart = () => cartItems.scrollIntoView({ behavior:"smooth" });

/* ⭐ Checkout */
document.getElementById("checkout-btn").addEventListener("click", async () => {

  if(cart.length === 0) return alert("Your cart is empty!");

  const name = document.getElementById("client-name").value;
  const phone = document.getElementById("client-phone").value;
  const location = document.getElementById("client-location").value;
  const delivery = document.getElementById("delivery-method").value;
  const payment = document.getElementById("payment-method").value;
  const whatsappNumber = document.getElementById("whatsapp-number").value;

  if(!name || !phone || !location){
    alert("Please fill all fields");
    return;
  }

  try {
    // final stock check + reduce
    for(const item of cart){
      const docRef = doc(db, "products", item.id);
      const snap = await getDoc(docRef);
      if(item.quantity > snap.data().stock){
        alert(`Only ${snap.data().stock} of ${item.name} available`);
        return;
      }
    }

    for(const item of cart){
      const docRef = doc(db, "products", item.id);
      await updateDoc(docRef, { stock: increment(-item.quantity) });
    }

    const cartList = cart.map(i => `${i.name} x ${i.quantity}`).join(", ");

    const msg = `
New Order From Lalasco Website
-------------------------
Name: ${name}
Phone: ${phone}
Location: ${location}
Delivery Method: ${delivery}
Payment Method: ${payment}

Items:
${cartList}
-------------------------
Total: GHS ${cartTotal.textContent}
    `;

    const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`;
    window.open(url, "_blank");

    cart = [];
    updateCartUI();
    alert("Order sent to WhatsApp!");

  } catch (err){
    console.log(err);
    alert("Error placing order");
  }
});
</script>

</body>
</html>
